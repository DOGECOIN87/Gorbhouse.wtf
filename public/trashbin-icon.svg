<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Body gradient - left to right for 3D effect -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b8b8b"/>
      <stop offset="30%" style="stop-color:#b8b8b8"/>
      <stop offset="70%" style="stop-color:#b8b8b8"/>
      <stop offset="100%" style="stop-color:#8b8b8b"/>
    </linearGradient>
    <!-- Lid gradient -->
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b6b6b"/>
      <stop offset="30%" style="stop-color:#888888"/>
      <stop offset="70%" style="stop-color:#888888"/>
      <stop offset="100%" style="stop-color:#6b6b6b"/>
    </linearGradient>
    <!-- Handle gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#888888"/>
      <stop offset="100%" style="stop-color:#6b6b6b"/>
    </linearGradient>
  </defs>

  <!-- Handle (arch shape) -->
  <path d="M 38 22 C 38 10, 62 10, 62 22" fill="none" stroke="url(#handleGrad)" stroke-width="7" stroke-linecap="round"/>

  <!-- Lid (rounded rectangle) -->
  <rect x="20" y="24" width="60" height="14" rx="4" ry="4" fill="url(#lidGrad)"/>

  <!-- Body (tapered rectangle with rounded bottom) -->
  <path d="M 24 40 L 26 82 Q 27 88, 34 88 L 66 88 Q 73 88, 74 82 L 76 40 Q 76 38, 74 38 L 26 38 Q 24 38, 24 40 Z" fill="url(#bodyGrad)"/>

  <!-- Vertical lines on body (darker grooves) -->
  <line x1="38" y1="46" x2="39" y2="80" stroke="#6b6b6b" stroke-width="5" stroke-linecap="round"/>
  <line x1="50" y1="46" x2="50" y2="80" stroke="#6b6b6b" stroke-width="5" stroke-linecap="round"/>
  <line x1="62" y1="46" x2="61" y2="80" stroke="#6b6b6b" stroke-width="5" stroke-linecap="round"/>
</svg>
